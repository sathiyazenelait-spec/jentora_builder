server.port=8082

# Application details
spring.application.name=jentora-backend

# H2 Database Configuration (File-based persistence in backend/data)
spring.datasource.url=jdbc:h2:file:./data/jentoradb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=jentora_admin_2026

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for database inspection if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
jentora.jwt.secret=9a3f8b7c2d1e0f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a
jentora.jwt.expiration-ms=86400000

# CORS Configuration
jentora.cors.allowed-origins=http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:3000
